version: '3.8'

services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    ports:
      - "80:80" # 👈 Cambiado a puerto 80 para que la clienta no tenga que poner ":5173" en el navegador
    depends_on:
      - backend